name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, for example 1.0.0 or 1.0.0-beta.1.
        required: true
        type: string
      dry_run:
        description: Verify configured trusted publishing, build, test and validate packages without publishing.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TYPED: ${{ inputs.version }}
        shell: bash
        run: |
          version="${TYPED:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Use a version such as 1.0.0 or 1.0.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check NuGet publishing configuration
        id: nuget-configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}
        shell: bash
        run: |
          if [[ -z "$NUGET_USER" && -z "$NUGET_API_KEY" ]]; then
            if [[ "$PUBLISH" == 'true' ]]; then
              echo "::error::Set the repository variable NUGET_USER and configure its NuGet.org Trusted Publishing policy for release.yml, or add the NUGET_API_KEY secret. See docs/releasing.md."
              exit 1
            fi
            echo "::notice::NuGet publishing is not configured. Dry run will validate packages without uploading them. See docs/releasing.md."
          else
            echo "NuGet publishing configuration is available."
          fi

  verify-nuget:
    name: Verify NuGet trusted publishing
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run && vars.NUGET_USER != ''
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify the NuGet.org policy
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Report successful authentication
        shell: bash
        run: echo "NuGet trusted publishing authentication succeeded. No packages were uploaded." >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Validate the release packages
        shell: pwsh
        run: ./.github/scripts/Test-Packages.ps1 -PackageDirectory packages -Version $env:VERSION

      - name: Get a short-lived NuGet publishing key
        id: nuget-login
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY == ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY || steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          foreach ($package in Get-ChildItem -LiteralPath packages -Filter '*.nupkg' -File) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json `
              --api-key $env:NUGET_API_KEY --skip-duplicate --timeout 120
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish the GitHub release
        shell: bash
        run: |
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          notes="Contains the StockSharp.DesktopDriver NuGet libraries and the desktop-driver and desktop-driver-mcp .NET tool packages. Requires .NET 10. WPF and the MAUI platform backend target Windows."
          gh release create "v$VERSION" packages/*.nupkg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DesktopDriver $VERSION" \
            --notes "$notes" \
            --generate-notes "${options[@]}"
